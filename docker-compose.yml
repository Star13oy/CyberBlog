services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberblog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberblog
      POSTGRES_PASSWORD: cyberblog123
      POSTGRES_DB: cyberblog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: